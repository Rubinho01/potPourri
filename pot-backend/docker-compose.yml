services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pot
      POSTGRES_PASSWORD: pot
      POSTGRES_DB: pot
    ports:
      - "5432:5432"
    volumes:
      - pot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pot -d pot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pot_pgdata: